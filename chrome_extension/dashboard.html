<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emotion Player Dashboard</title>

  <link rel="stylesheet" href="dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body class="dashboard">

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar">
    <img src="icons/headphones.png" class="logo">
    <h2>Emotion Player</h2>

    <button class="tab-btn active" data-tab="home">
      <img src="icons/homepage.png" class="icon">
      <span>Home</span>
    </button>

    <button class="tab-btn" data-tab="analytics">
      <img src="icons/analytics.png" class="icon">
      <span>Analytics</span>
    </button>

    <button class="tab-btn" data-tab="settings">
      <img src="icons/setting.png" class="icon">
      <span>Settings</span>
    </button>
  </div>

  <!-- ===== MAIN ===== -->
  <div class="main">

    <!-- ================= HOME ================= -->
<!-- =========================
      HOME TAB
========================= -->
<div id="home" class="tab-content active">

  <h1>Dashboard</h1>

  <div class="home-grid">

    <!-- ================= LEFT SIDE ================= -->
    <div class="left-panel">

      <!-- NOW PLAYING CARD -->
      <div class="card player-card">
        <h2>Now Playing</h2>

        <div class="now-playing">
          <div class="song-info">
            <audio id="audioPlayer"></audio>
            <p id="songTitle"><strong>No song selected</strong></p>
            <span id="songArtist">---</span>
          </div>

          <div class="controls">
            <button id="prevBtn">⏮</button>
            <button id="nextBtn">⏭</button>
          </div>
        </div>

        <div class="progress-container">
          <div id="progressBar"></div>
        </div>
      </div>

      <!-- PLAYLIST CARD (Height matched to Chart Card) -->
      <div class="card playlist-card">
        <h2>Playlist</h2>
        <!-- Ensure #playlist in CSS has: max-height: 300px; overflow-y: auto; -->
        <div id="playlist">
          <!-- JS will inject song-items here -->
        </div>
      </div>

    </div> <!-- End Left Panel -->


    <!-- ================= RIGHT SIDE ================= -->
    <div class="right-panel">

      <!-- CURRENT MOOD -->
      <div class="card mood-card">
        <div class="mood-row">
          <span id="moodEmoji" class="mood-emoji">😊</span>
          <div>
            <p class="mood-label">Current Mood</p>
            <h3 id="currentMoodText">Happy</h3>
            <span class="confidence">Confidence: 90%</span>
          </div>
        </div>
      </div>

      <!-- LANGUAGE SELECTOR -->
      <div class="card language-card">
        <h3>Language Selector</h3>
        <select id="languageSelect">
          <option value="punjabi" selected>Punjabi</option>
          <option value="hindi">Hindi</option>
        </select>
      </div>

      <!-- MOOD SUMMARY (The reference for height) -->
      <div class=mini-chart-box>
        <div class="card mood-summary-card">
        <h3>Today's Mood Summary</h3>
        <canvas id="miniMoodChart"></canvas>
      </div>

    </div> <!-- End Right Panel -->

  </div> <!-- End Home Grid -->

</div> <!-- End Home Tab -->
</div>

    <!-- ================= ANALYTICS ================= -->
    <div id="analytics" class="tab-content">
      <h1>📈 Weekly Analytics</h1>

      <div class="card">
        <!-- ✅ THIS IS REQUIRED -->
        <canvas id="moodChart"></canvas>
      </div>
    </div>

  <!-- ================= SETTINGS ================= -->
<div id="settings" class="tab-content">
  <h1>⚙ Settings</h1>

  <!-- ================= PLAYBACK =================
  <div class="card settings-card">
    <h3>🎵 Playback</h3>

    <label class="setting-row">
      <span>Auto Play</span>
      <input type="checkbox" id="autoPlay">
    </label>

    <label class="setting-row">
      <span>Loop Playlist</span>
      <input type="checkbox" id="loopPlaylist">
    </label>

    <div class="setting-row">
      <span>Volume</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5">
    </div>
  </div>
 -->

  <!-- ================= NOTIFICATIONS ================= -->
  <div class="card settings-card">
    <h3>🔔 Notifications</h3>

    <div class="setting-row">
      <span>Enable Notifications</span>

      <label class="switch">
        <input type="checkbox" id="enableNotif">
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="setting-row">
      <span>Rescan Timer</span>
      <input type="range" id="timeSlider" min="1" max="60" value="5">
    </div>

    <p>
      Rescan every 
      <strong><span id="timeValue">5</span></strong> minutes
    </p>
  </div>


  <!-- ================= APPEARANCE ================= -->
  <div class="card settings-card">
    <h3>🎨 Appearance</h3>

    <button id="themeToggleSettings" class="btn-theme">
      Toggle Theme
    </button>
  </div>


  <!-- ================= DATA ================= -->
  <div class="card settings-card">
    <h3>📊 Data</h3>

    <button id="clearData">Clear History</button>
  </div>

</div>
  </div>

  <!-- ✅ JS (KEEP AT BOTTOM) -->
   <script src="chart.js"></script>
  <script src="dashboard.js"></script>

</body>
</html>
